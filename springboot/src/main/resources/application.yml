server:
  port: 9090

# 数据库配置
# 敏感信息不写入版本库：
#   本地开发 —— 真实账号密码放在 application-local.yml（已被 .gitignore 排除），
#               启动时通过下面的 spring.profiles.active 自动加载；
#   部署环境 —— 通过环境变量 DB_USERNAME / DB_PASSWORD / DB_HOST / DB_PORT 注入。
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/blog-xs?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    # AI 对话用 SSE 长连接推送，一次可能持续数十秒，容器默认 30s 会把连接提前掐断
    async:
      request-timeout: 300000

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml  # 自定义Mapper XML文件存放路径（可选，无XML可省略）
  type-aliases-package: com.example.entity  # 实体类包名，简化XML中的类名引用（可选）
  configuration:
    map-underscore-to-camel-case: true  # 自动开启下划线转驼峰（如数据库user_name → 实体userName，MP默认开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启SQL日志打印（开发环境推荐，生产环境关闭）
  global-config:
    db-config:
      id-type: auto  # 主键策略：MySQL推荐auto（自增），Oracle可使用assign_id（雪花算法）

# 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

ip: localhost

# 文件访问地址前缀（上传后返回给前端的 URL 前缀）
#   本地直连后端跑：http://localhost:9090/files/
#   经 Nginx 部署（80 端口同源）：http://localhost/files/
file:
  access-url: http://localhost/files/

# JWT 签名密钥（独立于用户密码，避免以密码作为签名密钥）
#   本地开发可在 application-local.yml 中覆盖；生产环境通过环境变量 JWT_SECRET 注入随机值
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-in-production}

# ============ AI Agent 配置 ============
# api-key 密钥不入版本库：本地开发写 application-local.yml，部署环境注入环境变量 AI_API_KEY
ai:
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  connect-timeout: 10000
  read-timeout: 120000
  # 单次对话最多允许的工具调用轮次，防止模型反复调用同一工具陷入死循环
  max-iterations: 5
  temperature: 0.3
  # 单个工具结果回灌给模型前的截断长度，避免上下文爆炸
  tool-result-limit: 4000
  audit-enabled: true
