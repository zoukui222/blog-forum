# ============================================================
#  个人博客论坛系统 —— Nginx 配置
#  作用：1) 托管 Vue 打包产物（SPA）  2) 反向代理后端接口，实现前后端同源，消除浏览器跨域限制
#  部署：把本文件覆盖到 nginx/conf/nginx.conf，然后执行  nginx -t  →  nginx -s reload
#  访问：http://localhost/          前端页面
#        http://localhost/api/...   → 转发至 http://127.0.0.1:9090/...
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 文本类资源压缩，降低前端首屏体积
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 后端服务地址：本地开发为 9090，生产可替换为内网地址或容器名
    upstream blog_backend {
        server 127.0.0.1:9090;
    }

    server {
        listen       80;
        listen       [::]:80;   # 同时监听 IPv6：部分环境下 localhost 会先解析到 ::1
        server_name  localhost;

        # ---------- 0. 拒绝路径穿越请求（含 .. 的 URI 一律 400） ----------
        if ($request_uri ~* "\.\.") {
            return 400;
        }

        # ---------- 1. 前端静态资源托管（Vue 构建产物） ----------
        # 注意：Windows 版 nginx 对含中文的路径支持不稳定，故建议将 dist 发布到英文目录，
        #       发布命令见项目 deploy/deploy.bat（也可直接把 root 改成 vue/dist 的绝对路径）
        root   D:/deploy/blog-front;
        index  index.html;

        location / {
            # 静态资源兜底：本项目前端为 hash 路由（mode: 'hash'），前端路由信息在 # 之后，
            # 因此无需 history 回退配置；try_files 仅用于保证直接访问任意路径时不会出现 Nginx 404 页。
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # ---------- 2. 后端接口反向代理（前后端同源，规避跨域） ----------
        # 用 ^~ 前缀匹配：命中后不再尝试下方静态资源正则，避免 /files/xxx.png 被正则抢走而 404
        location ^~ /api/ {
            # 末尾斜杠会把 /api/xxx 转发为 /xxx，因此后端无需改动任何接口路径
            proxy_pass http://blog_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout    60s;
            # 富文本图片上传体积较大，放开请求体限制
            client_max_body_size  100m;
        }

        # ---------- 3. 上传文件访问（头像 / 封面 / 富文本图片，由后端提供） ----------
        location ^~ /files/ {
            proxy_pass http://blog_backend/files/;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size  100m;
        }

        # 后端越权拦截会返回 403（HTTP 状态码 200 + 业务码 403），此处不额外处理，交前端提示
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
